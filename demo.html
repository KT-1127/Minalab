<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>調査可視化・意見共有ボード（体験デモ）</title>
  <link rel="icon" type="image/png" href="img/favicon.png">

  <!-- Chart.js CDN (v4系) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    /* =====================================================
       CSS リセット・共通変数
    ===================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #1976d2;
      --primary-dark: #1256a3;
      --accent:       #ff9800;
      --bg:           #f5f5f5;
      --surface:      #ffffff;
      --border:       #e0e0e0;
      --text:         #212121;
      --text-muted:   #757575;
      --radius:       8px;
      --shadow:       0 2px 8px rgba(0,0,0,0.12);
      --shadow-lg:    0 4px 20px rgba(0,0,0,0.18);

      /* 付箋の色定義 */
      --sticky-yellow: #fff9c4;
      --sticky-yellow-border: #f9a825;
      --sticky-blue:   #bbdefb;
      --sticky-blue-border: #1976d2;
      --sticky-green:  #c8e6c9;
      --sticky-green-border: #388e3c;
      --sticky-pink:   #f8bbd9;
      --sticky-pink-border: #c2185b;
      --sticky-orange: #ffe0b2;
      --sticky-orange-border: #e65100;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    button:active { transform: scale(0.97); }

    input, textarea {
      font-family: inherit;
      font-size: 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus { border-color: var(--primary); }

    /* =====================================================
       トースト通知
    ===================================================== */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #323232;
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 9999;
      transition: transform 0.3s;
      white-space: nowrap;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.error { background: #c62828; }

    /* =====================================================
       デモバナー
    ===================================================== */
    #demoBanner {
      background: linear-gradient(90deg, #1565c0, #7b1fa2);
      color: #fff;
      text-align: center;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    #demoBanner span { opacity: 0.85; }

    /* =====================================================
       アプリ本体：左右分割レイアウト
    ===================================================== */
    #appScreen {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      background: var(--primary);
      color: #fff;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 52px;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    header h2 {
      font-size: 16px;
      font-weight: 700;
      flex: 1;
    }
    #headerUser {
      font-size: 13px;
      background: rgba(255,255,255,0.18);
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* メインエリア：左右分割 */
    #mainArea {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* =====================================================
       左ペイン：可視化（スクロール可）
    ===================================================== */
    #vizPane {
      width: 48%;
      min-width: 200px;
      overflow-y: auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* 可視化ヘッダーバー */
    .viz-panehead {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .viz-panehead .pane-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      flex: 1;
    }
    .viz-panehead .stats {
      font-size: 12px;
      color: var(--text-muted);
    }

    #vizContent { padding: 12px; flex: 1; }

    .viz-header {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .question-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    .question-card h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--primary);
    }
    .question-card .meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* グラフコンテナ */
    .chart-container {
      position: relative;
      height: 220px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* 自由記述一覧 */
    .text-list {
      list-style: none;
      max-height: 240px;
      overflow-y: auto;
    }
    .text-list li {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.5;
    }
    .text-list li:last-child { border-bottom: none; }
    .text-list li .idx {
      color: var(--text-muted);
      font-size: 12px;
      margin-right: 6px;
    }

    /* 選択肢集計テーブル */
    .choice-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .choice-table tr { border-bottom: 1px solid var(--border); }
    .choice-table tr:last-child { border-bottom: none; }
    .choice-table tr.clickable-row { cursor: pointer; }
    .choice-table tr.clickable-row:hover td { background: #f0f4ff; }
    .ct-label {
      padding: 5px 8px 5px 0;
      white-space: nowrap;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .ct-bar {
      width: 100%;
      padding: 5px 6px;
    }
    .ct-fill {
      height: 14px;
      border-radius: 3px;
      min-width: 2px;
      transition: width 0.4s ease;
    }
    .ct-count {
      padding: 5px 0 5px 6px;
      white-space: nowrap;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* =====================================================
       リサイザー（左右ペイン間のドラッグハンドル）
    ===================================================== */
    #paneResizer {
      width: 6px;
      cursor: col-resize;
      background: var(--border);
      flex-shrink: 0;
      transition: background 0.15s;
      position: relative;
      z-index: 20;
    }
    #paneResizer:hover,
    #paneResizer.active {
      background: var(--primary);
    }

    /* =====================================================
       右ペイン：付箋（スクロールなし・固定）
    ===================================================== */
    #stickyPane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      min-width: 200px;
    }

    /* 付箋上部コントロールバー */
    .sticky-controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .pane-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      margin-right: 4px;
    }

    /* スペース切り替えボタン */
    .space-btn {
      padding: 5px 12px;
      background: var(--bg);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid var(--border);
    }
    .space-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 色選択ボタン */
    .color-picker { display: flex; gap: 4px; align-items: center; margin-left: 4px; }
    .color-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.selected { border-color: #333; transform: scale(1.15); }
    .color-dot.yellow { background: var(--sticky-yellow); }
    .color-dot.blue   { background: var(--sticky-blue); }
    .color-dot.green  { background: var(--sticky-green); }
    .color-dot.pink   { background: var(--sticky-pink); }
    .color-dot.orange { background: var(--sticky-orange); }

    #addStickyBtn {
      background: var(--accent);
      color: #fff;
      padding: 5px 12px;
      font-weight: 700;
      font-size: 13px;
    }
    #addStickyBtn:hover { background: #e65100; }

    #refreshStickyBtn {
      background: var(--primary);
      color: #fff;
      padding: 5px 10px;
      font-size: 12px;
      margin-left: auto;
    }
    #refreshStickyBtn:hover { background: var(--primary-dark); }

    /* ボードキャンバス：右ペイン全体に広がる・スクロールなし */
    .board-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle, #ccc 1px, transparent 1px) 0 0 / 24px 24px,
        var(--bg);
    }
    #stickyBoard {
      position: absolute;
      inset: 0;
      user-select: none;
    }

    /* =====================================================
       付箋カード：テキスト量に合わせて縦に伸びる
    ===================================================== */
    .sticky-card {
      position: absolute;
      width: 170px;
      border-radius: 6px;
      border-bottom: 4px solid;
      box-shadow: var(--shadow);
      padding: 8px 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: grab;
      transition: box-shadow 0.15s;
      z-index: 10;
    }
    .sticky-card:active { cursor: grabbing; box-shadow: var(--shadow-lg); z-index: 50; }

    /* 色ごとのスタイル */
    .sticky-card.yellow { background: var(--sticky-yellow); border-color: var(--sticky-yellow-border); }
    .sticky-card.blue   { background: var(--sticky-blue);   border-color: var(--sticky-blue-border); }
    .sticky-card.green  { background: var(--sticky-green);  border-color: var(--sticky-green-border); }
    .sticky-card.pink   { background: var(--sticky-pink);   border-color: var(--sticky-pink-border); }
    .sticky-card.orange { background: var(--sticky-orange); border-color: var(--sticky-orange-border); }

    .sticky-author {
      font-size: 11px;
      font-weight: 700;
      color: rgba(0,0,0,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sticky-text {
      font-size: 13px;
      line-height: 1.6;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .sticky-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }
    .sticky-btn {
      background: rgba(0,0,0,0.1);
      color: rgba(0,0,0,0.6);
      padding: 2px 7px;
      font-size: 11px;
      border-radius: 12px;
    }
    .sticky-btn:hover { background: rgba(0,0,0,0.2); }
    .sticky-btn.like {
      background: rgba(255,100,100,0.15);
      color: #c62828;
    }
    .sticky-btn.like:hover { background: rgba(255,100,100,0.3); }
    .sticky-btn.like.liked-active {
      background: rgba(255,100,100,0.5);
      color: #b71c1c;
      font-weight: 700;
    }

    /* =====================================================
       コメントパネル（モーダル）
    ===================================================== */
    #commentModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }
    #commentModal.open { display: flex; }

    .comment-panel {
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 600px;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .comment-panel h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #closeCommentBtn {
      background: var(--bg);
      color: var(--text-muted);
      padding: 4px 12px;
      font-size: 14px;
    }

    #commentList {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .comment-item {
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      font-size: 14px;
    }
    .comment-item:last-child { border-bottom: none; }
    .comment-item .c-author { font-weight: 700; font-size: 12px; color: var(--primary); }
    .comment-item .c-time   { font-size: 11px; color: var(--text-muted); margin-left: 8px; }
    .comment-item .c-text   { margin-top: 3px; line-height: 1.5; }
    .comment-empty { color: var(--text-muted); font-size: 14px; text-align: center; padding: 20px; }

    .comment-input-row {
      display: flex;
      gap: 8px;
    }
    #newCommentText {
      flex: 1;
      padding: 9px 12px;
      resize: none;
      height: 60px;
    }
    #sendCommentBtn {
      background: var(--primary);
      color: #fff;
      padding: 9px 16px;
      align-self: flex-end;
    }
    #sendCommentBtn:hover { background: var(--primary-dark); }

    /* =====================================================
       ズームコントロール
    ===================================================== */
    .zoom-controls {
      display: flex;
      gap: 3px;
      align-items: center;
      margin-left: 4px;
    }
    .zoom-btn {
      background: var(--bg);
      color: var(--text);
      padding: 3px 8px;
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid var(--border);
    }
    .zoom-btn:hover { background: var(--border); }
    .zoom-label {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 36px;
      text-align: center;
    }

    /* =====================================================
       個人回答セクション
    ===================================================== */
    #individualSection {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    #individualSection h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--primary);
    }
    #openAllRespondentsBtn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      border-radius: var(--radius);
    }
    #openAllRespondentsBtn:hover { background: var(--primary-dark); }

    /* =====================================================
       全回答者モーダル
    ===================================================== */
    #allRespondentsModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 2500;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #allRespondentsModal.open { display: flex; }
    .all-respondents-panel {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 780px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .all-resp-header {
      padding: 16px 20px;
      background: var(--primary);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .all-resp-header h3 { font-size: 16px; font-weight: 700; }
    #closeAllRespondentsBtn {
      background: rgba(255,255,255,0.25);
      color: #fff;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
    }
    #closeAllRespondentsBtn:hover { background: rgba(255,255,255,0.4); }
    .all-resp-body {
      overflow-y: auto;
      flex: 1;
      padding: 0;
    }
    .all-resp-person {
      border-bottom: 2px solid var(--border);
    }
    .all-resp-person:last-child { border-bottom: none; }
    .all-resp-person-header {
      background: #f5f5f5;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .all-resp-qa {
      padding: 8px 20px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
      line-height: 1.6;
    }
    .all-resp-qa:last-child { border-bottom: none; }
    .all-resp-q { font-weight: 700; color: #1976d2; font-size: 12px; margin-bottom: 2px; }
    .all-resp-a { color: var(--text); }

    /* =====================================================
       AI分析セクション（デモでは無効）
    ===================================================== */
    #aiAnalysisSection {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    #aiAnalysisSection h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--primary);
    }
    .ai-demo-notice {
      background: #fff8e1;
      border: 1.5px solid #ffe082;
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 13px;
      color: #795548;
      line-height: 1.7;
    }
    .ai-demo-notice strong { color: #5d4037; }

    /* =====================================================
       コメント削除ボタン
    ===================================================== */
    .comment-item .c-delete-btn {
      background: none;
      color: #c62828;
      border: none;
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
      float: right;
    }
    .comment-item .c-delete-btn:hover { text-decoration: underline; }

    /* =====================================================
       回答者一覧モーダル
    ===================================================== */
    #respondentModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #respondentModal.open { display: flex; }
    .respondent-panel {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 620px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .respondent-panel h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    #respondentList {
      overflow-y: auto;
      flex: 1;
    }
    .respondent-item {
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 0;
      font-size: 13px;
    }
    .respondent-item:last-child { border-bottom: none; }
    .respondent-item .r-q { font-weight: 700; color: #1976d2; font-size: 12px; }
    .respondent-item .r-a { margin-top: 2px; }

    /* =====================================================
       確認モーダル
    ===================================================== */
    #confirmModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #confirmModal.open { display: flex; }
    .confirm-panel {
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    .confirm-panel p {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #212121;
    }
    .confirm-btns {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    #confirmOkBtn {
      background: #c62828;
      color: #fff;
      padding: 8px 20px;
      font-weight: 700;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    #confirmCancelBtn {
      background: #f5f5f5;
      color: #757575;
      padding: 8px 20px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    /* =====================================================
       レスポンシブ対応
    ===================================================== */
    @media (max-width: 480px) {
      header h2 { font-size: 14px; }
      #headerUser { display: none; }
      .sticky-card { width: 140px; }
      .chart-container { height: 180px; }

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

  function cleanup() {
    modal.classList.remove('open');
    okBtn.removeEventListener('click', handleOk);
    cancelBtn.removeEventListener('click', handleCancel);
  }
  function handleOk()     { cleanup(); onOk(); }
  function handleCancel() { cleanup(); }
  okBtn.addEventListener('click', handleOk);
  cancelBtn.addEventListener('click', handleCancel);
}

function detectColumnType(values) {
  var nonEmpty = values.filter(function(v) { return v !== '' && v !== null && v !== undefined; });
  if (nonEmpty.length === 0) return 'text';
  var numericCount = nonEmpty.filter(function(v) {
    return !isNaN(Number(String(v).trim())) && String(v).trim() !== '';
  }).length;
  if (numericCount / nonEmpty.length >= 0.7) return 'numeric';
  var multiCount = nonEmpty.filter(function(v) { return /[,，、]/.test(String(v)); }).length;
  if (multiCount / nonEmpty.length >= 0.2) return 'multi';
  var unique = {};
  nonEmpty.forEach(function(v) { unique[String(v).trim()] = true; });
  var uniqueCount = Object.keys(unique).length;
  var avgLen = nonEmpty.reduce(function(sum, v) { return sum + String(v).trim().length; }, 0) / nonEmpty.length;
  if (uniqueCount <= 12 && avgLen <= 30) return 'choice';
  return 'text';
}

function renderVizData(data) {
  var statsEl = document.getElementById('vizStats');
  var cardsEl = document.getElementById('vizCards');
  var emptyEl = document.getElementById('vizEmpty');

  statsEl.innerHTML = '回答数: <strong>' + data.count + '件</strong>　最終更新: ' + data.lastUpdated;

  Object.keys(chartInstances).forEach(function(k) {
    chartInstances[k].destroy();
    delete chartInstances[k];
  });
  cardsEl.innerHTML = '';

  if (!data.rows || data.rows.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  var headers = data.headers;
  var rows    = data.rows;

  for (var colIdx = 1; colIdx < headers.length; colIdx++) {
    var header = headers[colIdx];
    var values = rows.map(function(row) { return row[colIdx]; });
    var type   = detectColumnType(values);

    var card = document.createElement('div');
    card.className = 'question-card';

    if (type === 'numeric') {
      renderNumericCard(card, header, values, colIdx, rows, headers);
    } else if (type === 'choice') {
      renderChoiceCard(card, header, values, colIdx, rows, headers);
    } else if (type === 'multi') {
      renderMultiCard(card, header, values, colIdx, rows, headers);
    } else {
      renderTextCard(card, header, values, colIdx, rows, headers);
    }

    cardsEl.appendChild(card);
  }

  renderIndividualSection(data);
  renderAiAnalysisSection();
}

function renderPieChart(canvasId, labels, counts) {
  setTimeout(function() {
    var ctx = document.getElementById(canvasId);
    if (!ctx) return;
    var colors = labels.map(function(_, i) { return PIE_COLORS[i % PIE_COLORS.length]; });
    chartInstances[canvasId] = new Chart(ctx.getContext('2d'), {
      type: 'pie',
      data: {
        labels: labels,
        datasets: [{
          data: counts,
          backgroundColor: colors,
          borderColor: colors.map(function(c) { return c.replace('0.7', '1'); }),
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { font: { size: 12 }, padding: 10, boxWidth: 14 } },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                var total = ctx.dataset.data.reduce(function(a, b) { return a + b; }, 0);
                var pct   = total > 0 ? Math.round(ctx.parsed / total * 100) : 0;
                return ctx.label + ': ' + ctx.parsed + '件 (' + pct + '%)';
              }
            }
          }
        }
      }
    });
  }, 50);
}

function openRespondentModal(label, matchedRows, headers) {
  document.getElementById('respondentModalTitle').textContent = label + '（' + matchedRows.length + '件）';
  var listEl = document.getElementById('respondentList');
  listEl.innerHTML = '';
  matchedRows.forEach(function(row, idx) {

    item.className = 'respondent-item';

function renderNumericCard(card, header, values, colIdx, rows, headers) {
  var nums = values
    .filter(function(v) { var s = String(v).trim(); return s !== '' && !isNaN(Number(s)); })
    .map(Number);

  if (nums.length === 0) {
    card.innerHTML = '<h3>' + escapeHtml(String(header)) + '</h3><p style="color:var(--text-muted);font-size:14px;">回答がありません</p>';
    return;
  }

  var sum = nums.reduce(function(a, b) { return a + b; }, 0);
  var avg = (sum / nums.length).toFixed(1);
  var max = Math.max.apply(null, nums);
  var min = Math.min.apply(null, nums);

  var freq = {};
  nums.forEach(function(n) { freq[n] = (freq[n] || 0) + 1; });
  var labels = Object.keys(freq).sort(function(a, b) { return Number(a) - Number(b); });
  var counts = labels.map(function(l) { return freq[l]; });

  var canvasId = 'chart_' + colIdx;

  var breakdownHtml = '<table class="choice-table" style="margin-top:10px;">' +
    labels.map(function(l, i) {
      var pct = Math.round(freq[l] / nums.length * 100);
      return '<tr class="clickable-row" data-val="' + escapeHtml(l) + '">' +
             '<td class="ct-label">' + escapeHtml(l) + '</td>' +
             '<td class="ct-bar"><div class="ct-fill" style="width:' + pct + '%;background:' + PIE_COLORS[i % PIE_COLORS.length] + '"></div></td>' +
             '<td class="ct-count">' + freq[l] + '件 (' + pct + '%)</td></tr>';
    }).join('') + '</table>';

  card.innerHTML =
    '<h3>' + escapeHtml(String(header)) + '</h3>' +
    '<div class="meta">回答数: ' + nums.length + '件　平均: <strong>' + avg + '</strong>　最小: ' + min + '　最大: ' + max + '</div>' +
    '<div class="chart-container"><canvas id="' + canvasId + '"></canvas></div>' +
    '<p style="font-size:11px;color:var(--text-muted);margin-top:6px;">値をクリックすると回答者を表示</p>' +
    breakdownHtml;

  card.querySelectorAll('.clickable-row').forEach(function(tr) {
    tr.addEventListener('click', function() {
      var val = tr.dataset.val;
      var matched = rows.filter(function(row) { return String(row[colIdx]).trim() === val; });
      openRespondentModal(header + ' = ' + val, matched, headers);
    });
  });

  setTimeout(function() {
    var ctx = document.getElementById(canvasId);
    if (!ctx) return;
    chartInstances[canvasId] = new Chart(ctx.getContext('2d'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '人数',
          data: counts,
          backgroundColor: 'rgba(25,118,210,0.6)',
          borderColor:     'rgba(25,118,210,1)',
          borderWidth: 1,
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } } },
        onClick: function(evt, elements) {
          if (elements && elements.length > 0) {
            var idx2 = elements[0].index;
            var val2 = labels[idx2];
            var matched = rows.filter(function(row) { return String(row[colIdx]).trim() === val2; });
            openRespondentModal(header + ' = ' + val2, matched, headers);
          }
        }
      }
    });
  }, 50);
}

  nonEmpty.forEach(function(v) { var key = String(v).trim(); freq[key] = (freq[key] || 0) + 1; });

function renderMultiCard(card, header, values, colIdx, rows, headers) {
  var freq = {};
  var totalResponses = 0;

  values.forEach(function(v) {
    var s = String(v).trim();
    if (!s) return;
    totalResponses++;
    var parts = s.split(/[,，、]/);
    parts.forEach(function(p) { var key = p.trim(); if (key) freq[key] = (freq[key] || 0) + 1; });
  });

  var labels = Object.keys(freq).sort(function(a, b) { return freq[b] - freq[a]; });
  var counts = labels.map(function(l) { return freq[l]; });

  var tableHtml = '<table class="choice-table">' +
    labels.map(function(l, i) {
      var pct = Math.round(freq[l] / totalResponses * 100);
      return '<tr class="clickable-row" data-label="' + escapeHtml(l) + '">' +
             '<td class="ct-label">' + escapeHtml(l) + '</td>' +
             '<td class="ct-bar"><div class="ct-fill" style="width:' + pct + '%;background:' + PIE_COLORS[i % PIE_COLORS.length] + '"></div></td>' +
             '<td class="ct-count">' + freq[l] + '件</td></tr>';
    }).join('') + '</table>';

  var canvasId = 'chart_' + colIdx;
  card.innerHTML =
    '<h3>' + escapeHtml(String(header)) + '</h3>' +
    '<div class="meta">回答者: ' + totalResponses + '人　選択肢の延べ数: ' + counts.reduce(function(a,b){return a+b;},0) + '件（複数選択）　<span style="font-size:11px;color:var(--text-muted);">（行をクリックで回答者表示）</span></div>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;">' +
      '<div class="chart-container" style="width:200px;height:200px;flex-shrink:0;"><canvas id="' + canvasId + '"></canvas></div>' +
      '<div style="flex:1;min-width:160px;">' + tableHtml + '</div>' +
    '</div>';

  card.querySelectorAll('.clickable-row').forEach(function(tr) {
    tr.addEventListener('click', function() {
      var lbl = tr.dataset.label;
      var matched = rows.filter(function(row) {
        var s = String(row[colIdx]).trim();
        if (!s) return false;
        var parts = s.split(/[,，、]/);
        return parts.some(function(p) { return p.trim() === lbl; });
      });
      openRespondentModal(lbl, matched, headers);
    });
  });

  renderPieChart(canvasId, labels, counts);
}

      sticky.likedBy.push(currentUser.displayName);

      this.classList.add('liked-active');

  el.querySelector('.comment-btn').addEventListener('click', function(e) {

  var shareGroupEl = el.querySelector('.share-group-btn');

/* =============================================================
   付箋 — ドラッグ実装
============================================================= */
function setupDrag(el, sticky) {
  var startX, startY, startLeft, startTop;
  var moved = false;

  el.addEventListener('mousedown', function(e) {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
    if (e.button !== 0) return;
    startX    = e.clientX;
    startY    = e.clientY;
    startLeft = parseInt(el.style.left) || 0;
    startTop  = parseInt(el.style.top)  || 0;
    moved     = false;
    e.preventDefault();

    function onMouseMove(e) {
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) { isDragging = true; moved = true; }
      if (moved) {
        el.style.left = Math.max(0, startLeft + dx) + 'px';
        el.style.top  = Math.max(0, startTop  + dy) + 'px';
      }
    }
    function onMouseUp() {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup',   onMouseUp);
      if (moved) {
        sticky.x = parseInt(el.style.left);
        sticky.y = parseInt(el.style.top);
      }
      setTimeout(function() { isDragging = false; }, 10);
    }
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup',   onMouseUp);
  });

  el.addEventListener('touchstart', function(e) {
    if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
    var t = e.touches[0];
    startX    = t.clientX;
    startY    = t.clientY;
    startLeft = parseInt(el.style.left) || 0;
    startTop  = parseInt(el.style.top)  || 0;
    moved = false;
  }, { passive: true });

  el.addEventListener('touchmove', function(e) {
    var t = e.touches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) { isDragging = true; moved = true; }
    if (moved) {
      el.style.left = Math.max(0, startLeft + dx) + 'px';
      el.style.top  = Math.max(0, startTop  + dy) + 'px';
      e.preventDefault();
    }
  }, { passive: false });

  el.addEventListener('touchend', function() {
    if (moved) {
      sticky.x = parseInt(el.style.left);
      sticky.y = parseInt(el.style.top);
    }
    setTimeout(function() { isDragging = false; }, 10);
  });
}

function editStickyText(sticky, el) {
  var textEl = el.querySelector('.sticky-text');
  var current = textEl.textContent;

  var ta = document.createElement('textarea');
  ta.value = current;
  ta.style.cssText = 'width:100%;height:80px;resize:vertical;font-size:13px;padding:4px;border-radius:4px;border:1.5px solid var(--primary);';

  textEl.replaceWith(ta);
  ta.focus();
  ta.select();

  function save() {
    var newText = ta.value.trim() || current;
    var newTextEl = document.createElement('div');
    newTextEl.className = 'sticky-text';
    newTextEl.textContent = newText;
    ta.replaceWith(newTextEl);
    sticky.text = newText;
  }

  ta.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      save();
    } else if (e.key === 'Escape') {
      var orig = document.createElement('div');
      orig.className = 'sticky-text';
      orig.textContent = current;
      ta.replaceWith(orig);
    }
  });
  ta.addEventListener('blur', save);
}

  document.getElementById('newCommentText').value = '';
  appendComment(comment, currentStickyObj);
  showToast('コメントを送信しました（デモのため保存されません）');
});

function appendComment(comment, sticky) {
  var listEl = document.getElementById('commentList');
  var emptyEl = listEl.querySelector('.comment-empty');
  if (emptyEl) emptyEl.remove();

  var item = document.createElement('div');
  item.className = 'comment-item';

  var deleteBtn = comment.author === currentUser.displayName
    ? '<button class="c-delete-btn" title="削除">削除</button>'
    : '';

  item.innerHTML =
    deleteBtn +
    '<span class="c-author">' + escapeHtml(comment.author) + '</span>' +
    '<span class="c-time">'   + escapeHtml(comment.createdAt) + '</span>' +
    '<div class="c-text">'    + escapeHtml(comment.text) + '</div>';

  var delEl = item.querySelector('.c-delete-btn');
  if (delEl) {
    delEl.addEventListener('click', function() {
      showConfirm('このコメントを削除しますか？', function() {
        var arr = sticky.comments;
        var idx = -1; for (var _ci = 0; _ci < arr.length; _ci++) { if (arr[_ci].id === comment.id) { idx = _ci; break; } }
        if (idx !== -1) arr.splice(idx, 1);
        item.remove();
        if (!listEl.querySelector('.comment-item')) {
          listEl.innerHTML = '<p class="comment-empty">まだコメントはありません</p>';
        }
        showToast('コメントを削除しました');
      });
    });
  }

  listEl.appendChild(item);
  listEl.scrollTop = listEl.scrollHeight;
}
</script>
</body>
</html>
